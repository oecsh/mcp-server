# Publish @oecsh/mcp-server to npm with provenance, through npm trusted
# publishing (OIDC): no npm token is stored anywhere. Runs when a tag vX.Y.Z is
# pushed; refuses a tag that does not match package.json.
#
# npm side (once): package settings > Trusted Publisher > GitHub Actions,
# organization "oecsh", repository "mcp-server", workflow "publish.yml".
name: Publish to npm

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing and provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: npm --version

      - name: Tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      # publishConfig has access=public and provenance=true.
      - run: npm publish --ignore-scripts
